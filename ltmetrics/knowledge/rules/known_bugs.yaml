# Catalogued failure signatures. classify_error() matches an error body/message
# against `signatures` (case-insensitive substrings) and returns the entry — so
# LT Metrics recognises a failure it has seen before WITHOUT asking Claude. Each entry
# points at the repair rule that fixes it.
bugs:
  - id: jwt_token_rejected
    platform: magento
    signatures: ["token status 200", "consumer isn't authorized", "consumer isn t authorized"]
    summary: "Valid JWT bearer token rejected by an over-strict token validator."
    root_cause: "Token cleaner only accepted a 32-char opaque token; Magento here issues a JWT (dots, _-, >64 chars)."
    repair: fix_token_regex

  - id: product_not_found
    platform: magento
    signatures: ["product that was requested doesn't exist", "requested product doesn't exist", "no such entity with sku"]
    summary: "Add-to-cart used the CSV value as a SKU, but it was a search term."
    root_cause: "CSV carries a part number / product name, not a sellable SKU. Resolve via catalog search first."
    repair: resolve_sku_by_search

  - id: product_out_of_stock
    platform: magento
    signatures: ["you are trying to add is not available", "out of stock", "requested qty is not available", "the product is out of stock"]
    summary: "Resolved product/variant is not salable."
    root_cause: "Product exists but is out of stock / disabled for this store view."
    repair: stop_on_out_of_stock

  - id: empty_cart_at_shipping
    platform: magento
    signatures: ["shipping method can't be set for an empty cart", "add an item to cart and try again", "cart is empty"]
    summary: "Shipping attempted on an empty token quote."
    root_cause: "Storefront session-quote and token /carts/mine quote diverged, or add-to-cart never verified."
    repair: verify_cart_before_shipping

  - id: region_id_type
    platform: magento
    signatures: ["regionid", "nuts 1 code", "invalid region", "region_id"]
    summary: "regionId sent as a code string instead of an integer."
    root_cause: "Recorded region value copied verbatim; Magento expects an integer region id (or none)."
    repair: fix_region_id

  - id: payment_method_unavailable
    platform: magento
    signatures: ["requested payment method is not available", "payment method is not available"]
    summary: "Hardcoded / hosted-gateway payment method not enabled for the cart."
    root_cause: "Recorded hosted-gateway code + single-use card token cannot be replayed; pick an available offline method."
    repair: use_available_payment_method

  - id: product_lookup_admin_401
    platform: magento
    signatures: ["resolve: product 401", "products 401", "/v1/products 401"]
    summary: "Customer token used against the admin-only REST /V1/products endpoint."
    root_cause: "REST /V1/products (and /configurable-products/children) are admin-scoped; a customer token gets 401. Resolve the product via PUBLIC GraphQL instead."
    repair: use_graphql_resolution

  - id: terms_conditions_required
    platform: magento
    signatures: ["agree to the terms and conditions", "terms and conditions", "the order wasn't placed"]
    summary: "Order rejected because checkout agreements (T&C) were not accepted."
    root_cause: "Store has active checkout agreements; the place-order payload must include extension_attributes.agreement_ids. The REST agreements endpoints often 404 ('does not match any route') — harvest the ids from the recorded place-order body instead."
    repair: accept_checkout_agreements

  - id: agreements_route_missing
    platform: magento
    signatures: ["checkout agreements] code=404", "checkout-agreements 404", "does not match any route"]
    summary: "REST checkout-agreements endpoint not exposed (404)."
    root_cause: "Neither /carts/mine/checkout-agreements nor /checkoutAgreements is registered on this store; agreement ids must come from the recording."
    repair: accept_checkout_agreements

  - id: auth_expired
    platform: magento
    signatures: ["status code 401", "the consumer isn't authorized", "token expired"]
    summary: "Customer bearer token expired mid-run."
    root_cause: "Long run outlived the token lifetime."
    repair: refresh_token
