name: APEA Performance Tests

# Runs the performance test described in perf-test.yml (committed in the repo).
# Everything is configured in that ONE plain-English file — no inputs to fiddle
# with here. Edit perf-test.yml, commit, and the test runs.
on:
  workflow_dispatch:
    inputs:
      config:
        description: "Path to the plain-English config file"
        required: false
        default: "perf-test.yml"
        type: string
  push:
    branches: [main]
    paths:
      - "perf-test.yml"
      - "apea/**"
      - "requirements.txt"

jobs:
  perf-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4      # brings the recording + data CSV committed in the repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run APEA performance test
        env:
          # Optional: only needed if perf-test.yml references AI features or logins.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APEA_USERNAME: ${{ secrets.PERF_USERNAME }}
          APEA_PASSWORD: ${{ secrets.PERF_PASSWORD }}
        run: |
          python -m apea.cli --config "${{ github.event.inputs.config || 'perf-test.yml' }}" --check-sla | tee apea_output.txt

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apea-performance-reports
          path: |
            projects/**/reports/performance_report.html
            projects/**/reports/performance_report.xlsx
            projects/**/results/locust_stats.csv
            projects/**/results/locust_failures.csv
            apea_output.txt
          if-no-files-found: warn

      - name: Summarize
        if: always()
        run: |
          echo "### APEA Performance Test" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat apea_output.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
