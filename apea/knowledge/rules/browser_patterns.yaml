# Browser-interaction patterns for APEA Track B (real-browser execution).
# Gateway iframe field selectors, PUBLIC sandbox test cards, and 3DS handling.
# These are consulted at RUNNER-GENERATION time and baked into journey.json, so
# the runner process itself needs no KB access. Test cards are Stripe's public
# documented sandbox values (https://stripe.com/docs/testing) — never live data.

# ---------------------------------------------------------------------------
# RESILIENCE — generic, platform-agnostic fallbacks used when a recorded UI
# selector fails to match (e.g. brittle Tailwind/positional selectors captured
# from a SPA). The runner classifies each recorded CLICK into an "intent" from
# keywords in its target/label, and if the exact recorded selector fails, it
# tries this intent's fallback selectors (CSS) and visible-text labels in order.
# This is the KB "memory" of how to recover common checkout steps on ANY store —
# add a row to teach APEA a new platform's convention; nothing here is per-site.
# Recorded-issue references (why each intent exists) are noted inline.
# ---------------------------------------------------------------------------
resilience:
  settle_ms: 8000            # SPA hydrate/settle wait after navigate + click
  step_timeout_ms: 5000      # fast-fail per action (avoid multi-minute hangs)
  intents:
    signin:                  # ref: SPA sign-in link resolved but not clickable
      selectors: ["a[href*='login']", ".authorization-link a", "a.sign-in", "[data-action='sign-in']"]
      texts: ["Sign In", "Sign in", "Log in", "Login", "My Account"]
    product:                 # ref: brittle 'img.m-auto...' search-result click
      selectors: ["a.product-item-link", ".product-item-info a", ".product-item a",
                  "li.product a", ".product a", "a[href$='.html']", "[data-product-id] a"]
      texts: []
    add_to_cart:             # ref: '#product-addtocart-button > .block' not found
      selectors: ["#product-addtocart-button", "button.tocart", "button.add-to-cart",
                  "button[title*='Add to' i]", "button[id*='addtocart']"]
      texts: ["Add to Cart", "Add to Basket", "Add to bag", "Add to cart"]
    checkout:                # ref: '#checkout-link-button' timeout
      selectors: ["#checkout-link-button", "a[href*='checkout']:not([href*='cart'])",
                  "button.checkout", ".cart .checkout"]
      texts: ["Proceed to Checkout", "Go to Checkout", "Checkout", "Continue to checkout"]
    proceed_payment:         # ref: "[data-bind=... Proceed To Payment]" timeout
      selectors: ["[data-bind*='Proceed To Payment']", "button.continue",
                  "button.action.continue", ".payment-method-content button.action.primary"]
      texts: ["Proceed to Payment", "Continue to payment", "Review & Payments", "Next", "Continue"]
    place_order:             # ref: place-order / submit button variance
      selectors: ["#place-order", "button.action.primary.checkout", "button.checkout",
                  "button[title*='Place' i]"]
      texts: ["Place Order", "Pay now", "Complete order", "Confirm order", "Submit order"]

# ---------------------------------------------------------------------------
# PRICE PATTERNS — where the REAL (server-rendered) price lives in a product
# page's HTML, for the price auto-heal (price_resolver). Used when the REST/
# catalog API returns price 0 because the store prices CLIENT-SIDE. Most-specific
# first; add a row to teach APEA a new store's markup. Each must capture the
# numeric price in group 1. Platform-agnostic (schema.org / JSON-LD / Magento).
# ---------------------------------------------------------------------------
price_patterns:
  - 'product-schema-price[^>]*?value=["\'']([0-9][0-9,]*\.?[0-9]*)'
  - 'itemprop=["\'']price["\''][^>]*content=["\'']([0-9][0-9,]*\.?[0-9]*)'
  - '"@type"\s*:\s*"Offer"[\s\S]{0,300}?"price"\s*:\s*"?([0-9][0-9,]*\.?[0-9]*)'
  - 'data-price-amount=["\'']([0-9][0-9,]*\.?[0-9]*)'
  - '"final_price"\s*:\s*"?([0-9][0-9,]*\.?[0-9]*)'

stripe:
  # Any of these substrings in an iframe src/name marks a Stripe hosted-fields frame.
  frame_url_patterns: ["js.stripe.com", "elements-inner", "__privateStripeFrame", "hooks.stripe.com"]

  # Payment Element (current Stripe.js): several inputs inside one iframe.
  payment_element_fields:
    number: "input[name='number']"
    expiry: "input[name='expiry']"
    cvc: "input[name='cvc']"
    postal: "input[name='postalCode']"

  # Legacy Card Element (older split/single-line integration).
  card_element_fields:
    number: "input[name='cardnumber']"
    expiry: "input[name='exp-date']"
    cvc: "input[name='cvc']"
    postal: "input[name='postal']"

  # PUBLIC Stripe test cards. exp = any future date; cvc = any 3 digits; zip = any.
  test_cards:
    success: {number: "4242424242424242", exp: "12 / 34", cvc: "123", postal: "12345"}
    threeds: {number: "4000002760003184", exp: "12 / 34", cvc: "123", postal: "12345"}
    threeds_required: {number: "4000002500003155", exp: "12 / 34", cvc: "123", postal: "12345"}
    decline: {number: "4000000000000002", exp: "12 / 34", cvc: "123", postal: "12345"}

  # Stripe's TEST 3DS challenge modal (test mode only): a button to approve.
  threeds:
    frame_url_patterns: ["3ds", "hooks.stripe.com", "acs"]
    complete_selectors:
      - "#test-source-authorize-3ds"
      - "button:has-text('Complete authentication')"
      - "button:has-text('Complete')"
      - "button:has-text('Authorize')"

  # Site-specific — left null; supply via browser_payment for your integration.
  pay_trigger_selector: null      # click to reveal the payment form, if needed
  submit_selector: null           # the "Pay / Place order" button on YOUR page
  success_url_contains: null      # a URL fragment that confirms the order placed

paradoxlabs_cybersource:
  # ParadoxLabs' CyberSource module for Magento 2 (the "Credit / Debit Card"
  # method backed by paradoxlabs_cybersource, seen calling the store's own
  # secureAccept/getParams endpoint) renders the real card form in an iframe
  # served by CyberSource itself, communicating back to the storefront via
  # postMessage. Two CyberSource sub-integrations exist depending on store
  # config — Secure Acceptance (Hosted Checkout / Web-Mobile) and Flex
  # Microform (client-side tokenization) — both frame families and field sets
  # are listed so the same driver finds whichever one the store actually uses.
  # NOTE: unlike Stripe, CyberSource's hosted page can be reskinned by the
  # merchant, so these selectors are CyberSource's documented defaults and
  # should be verified/tuned against the real site before relying on them.
  frame_url_patterns:
    - "secureacceptance.cybersource.com"
    - "testsecureacceptance.cybersource.com"
    - "flex.cybersource.com"
    - "testflex.cybersource.com"

  # Flex Microform's documented container/field ids (client-side tokenization).
  payment_element_fields:
    number: "input#number, input[name='card_number']"
    expiry: "input[name='card_expiry_date'], input#expiry"
    cvc: "input#securityCode, input[name='card_cvn']"
    postal: "input[name='postal_code']"

  # Secure Acceptance Hosted Checkout's documented default field names.
  card_element_fields:
    number: "input[name='card_number']"
    expiry: "input[name='card_expiry_date']"
    cvc: "input[name='card_cvn']"
    postal: "input[name='bill_to_address_postal_code']"

  # PUBLIC CyberSource sandbox test cards (developer.cybersource.com/hello-world/
  # testing-guide.html) — sandbox only, never processes a real payment.
  # exp = any future date; cvc = any 3 digits (4 for Amex); zip = any.
  test_cards:
    success:    {number: "4111111111111111", exp: "12 / 34", cvc: "123",  postal: "12345"}
    mastercard: {number: "5555555555554444", exp: "12 / 34", cvc: "123",  postal: "12345"}
    amex:       {number: "378282246310005",  exp: "12 / 34", cvc: "1234", postal: "12345"}
    discover:   {number: "6011111111111117", exp: "12 / 34", cvc: "123",  postal: "12345"}
    decline:    {number: "4000000000000002", exp: "12 / 34", cvc: "123",  postal: "12345"}

  # CyberSource Payer Authentication (3DS2) challenge, if enabled on the store.
  # The actual challenge iframe is issuer-hosted (ACS), so this is a best-effort
  # generic guess — verify against the real 3DS challenge page if hit.
  threeds:
    frame_url_patterns: ["cardinalcommerce", "acs", "authenticate"]
    complete_selectors:
      - "button:has-text('Submit')"
      - "button:has-text('Continue')"
      - "input[type='submit']"

  # Site-specific — left null; supply via browser_payment for your integration.
  pay_trigger_selector: null
  submit_selector: null
  success_url_contains: null

# ---------------------------------------------------------------------------
# REPLAY PROFILES — whether a gateway's card step can be reproduced at the HTTP
# layer (so a Locust VU can create real sandbox orders WITHOUT a browser), and if
# so, how. Consumed by agents/payment_replay.py, which combines this KB knowledge
# with the ACTUAL captured payment network sequence (browser_track.payment_network)
# to reach an evidence-based verdict per recording. Generic across platforms — add
# a gateway block to teach APEA a new one.
#
#   replayable: true        HTTP replay can create orders (per-VU token re-mint)
#              conditional  possible only if specific conditions hold; check evidence
#              false        cannot be replayed (hard blocker)
#              unknown      no profile; rely purely on captured evidence
#
# EVIDENCE CLASSES — a general APEA rule, not only a CyberSource one:
#
#   Static-code evidence identifies a LIKELY INTEGRATION.
#   Runtime traffic evidence proves the ACTUAL TRANSACTION FLOW.
#
# Gateway field names appear in a store's own JavaScript bundles — the
# ParadoxLabs_CyberSource JS lists access_key, signature and transaction_uuid.
# That tells you which integration the store uses. It must NEVER be promoted to
# "we captured a signed package": only a real captured request or response
# counts towards a replayability verdict. Conflating the two produced a false
# positive here, and the same trap exists for every gateway.
# ---------------------------------------------------------------------------
replay_profiles:
  _default:
    replayable: unknown
    mechanism: undetermined
    reasons:
      - "No known replay profile for this gateway; verdict comes from captured evidence."

  stripe:
    replayable: true
    mechanism: client_tokenization
    mint:
      description: >-
        Mint a fresh PaymentMethod/token per VU using the PUBLISHABLE key and a
        PUBLIC test PAN, then POST that token to the merchant's own confirm
        endpoint (the one captured in the browser run). The merchant backend
        finishes the order with its server-side secret — the VU never needs it.
      needs: [publishable_key, public_test_card]
      mint_endpoint_hint: "api.stripe.com/v1/payment_methods (or /v1/tokens)"
    confirm_endpoint_hint: "merchant backend payment/confirm (from capture)"
    reasons:
      - "Card is tokenized client-side into a re-mintable token; sandbox tokens are creatable with the publishable key, so each VU can mint its own."

  # === PAYMENT READINESS: the settled architecture ==========================
  # Reviewed with an external performance-engineering architect, 2026-08-27.
  # Applies to any gateway, any platform. Ordered by what to try first.
  payment_readiness_contract:
    resolution_order:
      - id: discover_existing
        what: "Log in as the account and ask the store for its saved cards."
        why: >-
          No browser, no minting, no human. Independent of HOW the card was
          enrolled, so it survives a gateway migrating its enrolment UI (e.g.
          CyberSource replacing Secure Acceptance with Unified Checkout). That
          longer shelf life is the main reason to build this before enrolment.
        magento_paradoxlabs: "GET /V1/tokenbase/mine/search with the customer bearer token"
      - id: browser_enrolment
        what: "Provision a missing card once, in pre-flight, through the real UI."
        why: >-
          Uses the same path a customer traverses, so the stored card behaves the
          way production's does. Browser cost is irrelevant outside measurement.
        caution: "Its selectors come from the recording, so a gateway UI change breaks it."
      - id: fail
        what: "If a declared card cannot be resolved or provisioned, FAIL pre-flight."
    not_planned:
      - id: direct_tms_api_provisioning
        why: >-
          Creating the instrument through an API path the application never uses
          risks a card that behaves subtly differently under the checkout being
          measured, with no signal that it does. Fidelity beats convenience here.

    # The invariant that makes a result trustworthy.
    declared_intent:
      rule: "Intent is DECLARED in the test data and NEVER inferred from a blank value."
      matrix:
        - "CREDIT_CARD + card resolved      -> run"
        - "CREDIT_CARD + card provisioned   -> run"
        - "CREDIT_CARD + unresolved         -> FAIL, never substitute"
        - "NET_TERMS   + available          -> run"
        - "NET_TERMS   + unavailable        -> FAIL"
      why: >-
        A run that was meant to exercise the card path, silently exercises the
        invoice path, and reports a pass is the same defect as an order that
        completes at price 0 and reports a pass: every HTTP call succeeded and
        the thing under test never ran.

    # Provisioning and measurement must not overlap.
    preflight_freeze_boundary:
      preflight_may: [discover, provision, repair, drive_a_browser, retry]
      measured_run_may_not: [provision, repair, drive_a_browser, mutate_test_state]
      on_unexpected_loss_mid_run: "FAIL — a disappearing card is an observed result, not permission to mutate the environment."
      why: >-
        Mid-run repair injects an unbounded browser launch into the measured
        window. The response time that iteration reports is then meaningless.
      output: "Freeze a resolved run manifest; the load engine consumes that, not the intent data."

    # Unique accounts are necessary but NOT sufficient.
    account_allocation:
      default_strategy: exclusive
      size_against: "peak concurrent checkout users, not total iterations"
      identity: "customer + store context, not the email string"
      why: >-
        Platform carts are keyed to the customer. Several concurrent journeys on
        one account contend for the same quote and produce functional failures
        that pollute the measurement (Magento: "The quote can't be created.").
      cart_hygiene: >-
        A leased account must also start CLEAN. A previous failed run can leave an
        active cart with items and a shipping method already chosen, which
        contaminates the next run silently.
      separate_scenario: >-
        Same-account concurrency is worth testing deliberately -- quote locking,
        duplicate-order protection, error quality -- but as its own scenario with
        its own pass criteria, never mixed into the throughput baseline.

    # What must be true before APEA may print READY.
    ready_definition:
      - "requested VUs have independently allocated accounts"
      - "no concurrent account collision possible"
      - "starting cart state validated clean"
      - "payment intent explicitly declared per account"
      - "requested gateway available on the store"
      - "stored card resolved where a card is declared"
      - "resolved card active and not expired"
      - "no silent payment fallback reachable"
      - "address and shipping prerequisites satisfied"
      - "target responding within its own baseline before load is applied"
      - "resolved workload frozen"

    # Do not accidentally measure someone else's sandbox.
    external_dependency_lanes:
      lanes:
      - lane: application_capacity
        concurrency: high
        payment: "virtualised or stubbed at the integration boundary"
        measures: "the application under test"
      - lane: payment_integration
        concurrency: low_to_medium
        payment: "the real gateway sandbox"
        measures: "genuine integration behaviour"
      - lane: end_to_end_journey
        concurrency: "a few browsers"
        payment: "real UI, including any challenge flow"
        measures: "correctness and experience"
      why: >-
        A gateway sandbox may rate-limit, may not match production capacity, and
        may prohibit sustained load by agreement. Pointing a full-capacity run at
        one turns an application performance test into a test of someone else's
        test environment.

    secrets:
      rule: "A vault token is not PAN data, but it can be used to charge a saved card. Redact it from logs, timelines and reports once runtime binding has succeeded."

    # How to PROVE discovery works, without pinning a rotating value.
    discovery_verification:
      wrong: >-
        Asserting that the discovered token equals a value captured on some
        earlier date. Tokens rotate and test cards get replaced, so a legitimate
        change makes the check fail and the failure means nothing.
      right:
        - "the discovery endpoint returns the account's cards"
        - "the discovered token equals the card_id sent by a CONTEMPORANEOUS checkout"
        - "one order placed with the discovered token reports the expected card type and last four"
      note: >-
        A one-off equality check against a known capture is fine as a first
        manual proof. It must not become the permanent automated assertion.

  # --- CHECK THIS FIRST for ANY hosted card gateway ------------------------
  # A hosted gateway blocks HTTP replay of the card NUMBER. It does not block
  # replay of a card the account ALREADY holds. Once a card is vaulted, the
  # store refers to it by an opaque token and the checkout call carries only
  # that token — ordinary parameterisation, no browser, no gateway hop, no
  # per-VU minting. Most "cards cannot be load tested" conclusions are really
  # "first-time card entry cannot be load tested", which is a much narrower
  # claim. Establish whether a vault exists BEFORE designing anything harder.
  vaulted_card_token:
    replayable: true
    mechanism: stored_token_reuse
    applies_to: [paradoxlabs_cybersource, stripe, braintree, adyen, any_vaulting_gateway]
    mint:
      description: >-
        Nothing to mint at run time. Pay once by hand per test account, then read
        the token the store sends on the order call and parameterise it like any
        other test-data value. One token serves every iteration for that account.
      needs: [test_account_with_saved_card, captured_order_call]
      capture_hint: >-
        DevTools -> Network -> the place-order / payment-information request ->
        paymentMethod.additional_data. The token key is gateway specific:
        card_id or public_hash (ParadoxLabs/Magento vault), payment_method
        (Stripe), paymentMethodNonce or token (Braintree),
        storedPaymentMethodId (Adyen).
    blockers:
      - "The token is bound to ONE customer. A token captured on account A is rejected for account B, so multi-user runs need one token per account in the data file."
      - "Step-up authentication (3-D Secure / payer auth) may be enforced per transaction. If it is, the run fails at payment with a payer-auth error and only the browser track can proceed."
      - "A vault may hold the card only for the checkout that created it. Save the card explicitly when capturing, rather than relying on a transient token."
    validated:
      date: 2026-08-25
      gateway: paradoxlabs_cybersource
      platform: magento
      result: PASS
      evidence: >-
        One card_id captured from a single manual checkout placed 5 consecutive
        orders in one load run over plain HTTP, 0 failures, with no browser in
        the loop. The orders render as "Credit / Debit Card - Visa ending NNNN"
        in the storefront, not as the offline fallback method. The captured
        token carried save:false and the payer_auth session id was deliberately
        omitted, and payment still succeeded — so on that configuration neither
        a permanent vault entry nor a per-transaction 3-D Secure session was
        required. Both are configuration dependent: re-establish per environment
        rather than assuming.
    reasons:
      - "The card number never enters the replay. The token is already server-side data, so the gateway hop the iframe protects has already happened."
      - "Cheapest option by far: no per-VU minting, no service virtualisation, no browser fleet."

  paradoxlabs_cybersource:
    replayable: conditional
    mechanism: server_signed_single_use
    mint:
      description: >-
        Fetch fresh signed params from the merchant's OWN getParams/secureAccept
        endpoint per VU (the merchant signs server-side — no secret needed by the
        client), then POST a PUBLIC test card to the CyberSource endpoint.
      needs: [merchant_getparams_endpoint, public_test_card]
      mint_endpoint_hint: "store getParams / secureAccept (from capture)"
    confirm_endpoint_hint: "*secureacceptance.cybersource.com/* (from capture)"
    blockers:
      - "signature / access_key / transaction_uuid are single-use and time-bound — a captured request cannot be replayed as-is."
      - "CyberSource's hosted endpoint may enforce Origin / device-fingerprint checks that reject a raw server-side POST."
    reasons:
      - "Replayable ONLY IF the merchant getParams endpoint is callable per VU AND the CyberSource POST is accepted in sandbox — decide from the captured sequence, not by assumption."
      - "This entry covers FIRST-TIME card entry. If the test account can save a card, use `vaulted_card_token` instead: it is validated, needs no minting, and was proven on this exact module on 2026-08-25."

  # --- CyberSource: THREE DISTINCT integrations, not one -------------------
  # "paradoxlabs_cybersource" above is the Magento MODULE. WHICH CyberSource
  # integration it is configured for decides whether HTTP replay is possible at
  # all, and the three were previously collapsed into the loose label "Flex
  # Microform". They are separate mechanisms with separate endpoints:
  #
  #   Secure Acceptance  the merchant signs the form SERVER-SIDE; the card fields
  #                      are excluded from the signature because the customer
  #                      types them. Underneath the hosted UI this is a signed
  #                      HTTP form POST — so a browser rendering CyberSource
  #                      content does NOT prove the protocol is unreproducible.
  #   Microform v2       /microform/v2/sessions, then Microform JS calls
  #                      createToken() inside a CyberSource iframe. Genuinely
  #                      needs a browser: there is no server-side equivalent.
  #   Flex API v2        /flex/v2/sessions -> one-time JWK -> JWE ->
  #                      /flex/v2/tokens. Fully server-side, so a VU can mint its
  #                      own token and it scales.
  cybersource_secure_acceptance:
    replayable: conditional          # a CANDIDATE — prove with one sandbox txn
    mechanism: signed_form_replay
    requires_validation: true
    mint:
      description: >-
        Per VU: POST the merchant's own getParams / secureAccept endpoint to mint
        a FRESH signed parameter set (access_key, profile_id, transaction_uuid,
        signed_date_time, signed_field_names, signature), then POST those plus a
        PUBLIC sandbox test card to the CyberSource test endpoint. No JWE, no
        token factory, and no need for the merchant backend to accept a different
        token type — this is ordinary correlation of dynamic signed fields.
      needs: [merchant_getparams_endpoint, sandbox_profile, public_test_card]
      mint_endpoint_hint: "store getParams / secureAccept (from capture)"
    confirm_endpoint_hint: "testsecureacceptance.cybersource.com/pay (sandbox)"
    blockers:
      - "transaction_uuid must be UNIQUE per transaction (CyberSource uses it to detect duplicates) and signed_date_time is time-bound. Mint a fresh package per VU per iteration; a recorded package cannot be replayed 1,000 times."
      - "The returned signed package is IMMUTABLE. signed_field_names covers the business fields (amount, currency, reference_number, transaction_type, locale, payment_method), so altering any of them after signing invalidates the signature and CyberSource rejects it. Correlation must copy the package through unchanged — it cannot parameterise amount or currency."
      - "Payer Authentication (3DS / SCA) can still divert an individual transaction to an ACS challenge, which needs the browser track."
    # Card fields move from CyberSource's hosted form into the load script under
    # this strategy — CyberSource excludes card_number and card_cvn from the
    # merchant signature precisely because the customer normally types them. That
    # is acceptable for a sandbox proof with approved test cards and unacceptable
    # anywhere else, so the constraints are recorded here BEFORE anything is built.
    safeguards:
      environment: sandbox_only
      allowed_submit_hosts: ["testsecureacceptance.cybersource.com"]
      forbid_submit_hosts: ["secureacceptance.cybersource.com"]
      real_pan_prohibited: true
      redact_card_number: true
      redact_cvn: true
      save_request_body: false
    reasons:
      - "Underneath the hosted UI this is a signed HTTP form POST, so protocol replay is a CANDIDATE — prove it with one sandbox transaction before relying on it."
    # Promote to protocol_supported: true / validated_strategy:
    # dynamic_signed_form_replay ONLY after a sandbox transaction returns ACCEPT.
    # Keep 3ds_challenge.browser_required true even then: Secure Acceptance can be
    # configured for Payer Authentication, including 3DS 2.0.
    validation_gate:
      # Compare SEMANTICALLY, after form-decoding — never byte for byte. "%20"
      # vs "+", HTTP body parameter ordering and re-encoding differences are all
      # legitimate and would otherwise produce false negatives. What must match
      # exactly is every SIGNED field's decoded value and, critically, the ORDER
      # of the signed_field_names list, because the signature is computed over
      # the name=value pairs in that sequence.
      compare: semantic_after_form_decode
      order_sensitive: [signed_field_names]
      # Expected to appear ONLY in the submission, never in the signed package:
      # CyberSource excludes these from the merchant signature because the
      # customer normally types them. Their absence from getParams is correct,
      # not a missing field.
      expected_only_in_submission: [card_number, card_cvn]
      required_evidence:
        - "P0-A1  getParams RESPONSE captured and carries a complete FRESH signed package"
        - "P0-A2  every signed value reaches CyberSource unchanged, with signed_field_names order intact"
        - "P0-A3  one sandbox POST to the TEST endpoint returns ACCEPT"
        - "P0-A4  the return leg reaches the store and the order is marked paid"
      # THREE capture groups prove FOUR gates — group 3 covers both A3 and A4.
      # Listed so the evidence is gathered once, completely, rather than in
      # fragments that later can't be told apart.
      capture_checklist:
        - group: "1. store getParams response"
          save: "raw response body + decoded JSON/form fields"
          proves: [P0-A1]
        - group: "2. CyberSource /pay request"
          save: "URL, method, headers, decoded form fields — card values REDACTED"
          proves: [P0-A2]
          compare: "signed fields semantically; preserve signed_field_names order"
        - group: "3. CyberSource /pay response + return-to-store traffic"
          save: "the decision/result, then every redirect / POST / callback until the order is marked paid"
          proves: [P0-A3, P0-A4]
      # Three states, not two. A missing capture is NOT a failed gate: if
      # CyberSource returns ACCEPT but the capture missed the merchant return
      # callback, P0-A4 is INCONCLUSIVE — recording it as FAIL would wrongly
      # close off a strategy that may work.
      result_states: [PASS, FAIL, INCONCLUSIVE]
      overall_states: [PROVEN, NOT_REPLAYABLE, MORE_EVIDENCE_REQUIRED]
      return_leg:
        note: >-
          CyberSource signs its RESPONSE fields as well, so the return leg is
          itself correlatable. Without P0-A4 the proof covers only that a payment
          can be SUBMITTED — not that the store's order completes the same
          lifecycle the browser produces.
    3ds_challenge:
      browser_required: true

  cybersource_microform_v2:
    replayable: false
    mechanism: browser_client_tokenization
    mint:
      description: >-
        No server-side path exists. /microform/v2/sessions returns a capture
        context only the Microform JS can use, and microform.createToken() runs
        inside a CyberSource-hosted iframe.
      needs: [browser]
    reasons:
      - "Tokenization happens in CyberSource's iframe via client-side JavaScript — an HTTP-level tool cannot reproduce it."
    alternatives:
      - "cybersource_flex_api_v2 — substitute a server-side token, but first prove the merchant backend accepts that token type"
      - "browser track — drive the real iframe with a few VUs"
      - "payment virtualization — for high-volume capacity testing"

  cybersource_flex_api_v2:
    replayable: true
    mechanism: server_side_jwe_tokenization
    mint:
      description: >-
        Per VU: POST /flex/v2/sessions for a capture context carrying a one-time
        public key, encrypt a PUBLIC sandbox test card as JWE, POST that to
        /flex/v2/tokens, and inject the returned transient token into the
        merchant's payment request. Fully server-side, so it scales.
      needs: [sandbox_rest_credentials, public_test_card]
      mint_endpoint_hint: "apitest.cybersource.com/flex/v2/sessions then /flex/v2/tokens"
    blockers:
      - "A transient token is valid ~15 minutes or until ONE successful authorization — mint per VU, never share one."
      - "COMPATIBILITY: a Flex token can carry a different token type than a Microform one, and the merchant backend may validate that shape. Prove one transaction end to end before building on this."
    reasons:
      - "Documented server-side flow, so a VU can mint its own token without a browser."

  # Signature hints let the classifier map a captured host/path to a profile even
  # when the runner didn't tag a gateway. Substring match, case-insensitive.
  # Ordered MOST SPECIFIC FIRST: the three CyberSource integrations must win over
  # the generic module label, or the classifier reports the wrong strategy.
  _signatures:
    stripe: ["js.stripe.com", "api.stripe.com", "stripe"]
    cybersource_flex_api_v2: ["/flex/v2/sessions", "/flex/v2/tokens"]
    cybersource_microform_v2: ["/microform/v2/sessions", "microform", "flex-microform"]
    cybersource_secure_acceptance: ["secureaccept/getparams", "secureacceptance",
                                    "testsecureacceptance"]
    paradoxlabs_cybersource: ["cybersource", "flex.cybersource"]
    adyen: ["adyen", "checkoutshopper"]
    braintree: ["braintree", "paypal"]
    checkout_com: ["checkout.com"]
