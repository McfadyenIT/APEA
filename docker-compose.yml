# LT Metrics — Docker Compose
#
# Start the web UI:
#     docker compose up ltmetrics
#     open http://localhost:8000
#
# Run a headless test (CI style) with distributed workers inside the container:
#     docker compose run --rm runner \
#       python -m ltmetrics.cli --url https://example.com --test-type stress \
#       --users 500 --duration 900 --workers 4 --check-sla
#
# Results/reports are written to the mounted ./projects volume on the host.

services:
  ltmetrics:
    build: .
    image: ltmetrics:latest
    container_name: ltmetrics-web
    ports:
      - "8000:8000"
    volumes:
      - ./projects:/app/projects
      - ./ltmetrics_history.db:/app/ltmetrics_history.db
    restart: unless-stopped

  runner:
    build: .
    image: ltmetrics:latest
    profiles: ["cli"]
    volumes:
      - ./projects:/app/projects
      - ./ltmetrics_history.db:/app/ltmetrics_history.db
    environment:
      LTM_TARGET_URL: ${LTM_TARGET_URL:-}
      LTM_TEST_TYPE: ${LTM_TEST_TYPE:-load}
      LTM_USERS: ${LTM_USERS:-}
      LTM_DURATION: ${LTM_DURATION:-}
      LTM_WORKERS: ${LTM_WORKERS:-1}
      LTM_USERNAME: ${LTM_USERNAME:-}
      LTM_PASSWORD: ${LTM_PASSWORD:-}
    entrypoint: ["python", "-m", "ltmetrics.cli"]
    command: ["--check-sla"]
